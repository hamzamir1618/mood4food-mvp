name: fipe_flutter
description: FIPE MVP — Local-first decision-support interface.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──
  provider: ^6.1.2

  # ── HTTP Client (talks to local FastAPI) ──
  http: ^1.2.2

  # ── UI Essentials ──
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
