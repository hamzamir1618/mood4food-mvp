<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mood4Food — AI-powered food recommendation engine that finds the best dish for your budget, health goals, and taste preferences.">
  <title>Mood4Food — Smart Food Recommender</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- ── Hero / Header ───────────────────────────────────────────────── -->
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-brand">
        <div class="hero-icon">🍽️</div>
        <div class="hero-text">
          <h1>Mood4Food</h1>
          <p>Your Smart Food Recommender</p>
        </div>
      </div>
      <button class="hero-refresh" id="refresh-btn" title="Refresh recommendations" aria-label="Refresh recommendations">
        🔄
      </button>
    </div>
  </header>

  <!-- ── Query Input Bar ────────────────────────────────────────────── -->
  <div class="query-bar-wrapper">
    <div class="query-bar" id="query-bar">
      <form id="query-form" autocomplete="off" enctype="multipart/form-data">
        <div class="query-input-row">
          <span class="query-icon">🔍</span>
          <input type="text" id="query-input" class="query-input"
                 placeholder='Try: "spicy food under 500 rupees, no dairy"'
                 aria-label="Describe what you want to eat">
          <button type="button" class="upload-btn" id="audio-btn" title="Attach audio">🎤</button>
          <button type="button" class="upload-btn" id="image-btn" title="Attach image">📷</button>
          <input type="file" id="image-file" accept=".jpg,.jpeg,.png,.webp" hidden>
          <button type="submit" class="query-submit" id="query-submit">
            Find Food
          </button>
        </div>
        <div class="file-chips" id="file-chips"></div>
      </form>
      <div class="query-status" id="query-status"></div>
    </div>
  </div>

  <div class="app-container">

    <!-- ── Loading State ─────────────────────────────────────────────── -->
    <div class="loading-state" id="loading-state">
      <div class="spinner"></div>
      <p>Finding the best dish for you…</p>
    </div>

    <!-- ── Error State ───────────────────────────────────────────────── -->
    <div class="error-state" id="error-state" style="display:none;">
      <div class="error-icon">😔</div>
      <h3>Couldn't load recommendations</h3>
      <p id="error-message">Make sure the backend server is running on port 8000.</p>
      <button onclick="fetchBlueprint()">Try Again</button>
    </div>

    <!-- ── Main Content ──────────────────────────────────────────────── -->
    <div class="main-content" id="main-content" style="display:none;">
      <!-- Populated by app.js -->
    </div>

  </div>

  <!-- ── Recipe Modal Overlay ──────────────────────────────────────── -->
  <div class="recipe-modal" id="recipe-modal">
    <div class="recipe-modal-backdrop" id="recipe-modal-backdrop"></div>
    <div class="recipe-modal-content" id="recipe-modal-content">
      <!-- Populated by app.js -->
    </div>
  </div>

  <!-- ── Toasts & Global Loading ─────────────────────────────────────── -->
  <div id="toast-container" class="toast-container"></div>
  <div id="recalc-loading" class="recalc-loading" style="display:none;">
    <div class="spinner"></div> Recalculating...
  </div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
